# Esempio di io.cfg con una microSD (modulo SPI) - VesevOS 1.7.67
# Formato di ogni riga: <nome> <classe> <CS> <flag> <MOSI> <SCK> <MISO> <kHz>
#   nome   = sd1 (una sola microSD; minuscole e numeri)
#   classe = 7 (microSD)
#   CS     = GPIO del chip select (qui 10)
#   flag   = 0
#   MOSI, SCK, MISO = GPIO 11, 12, 13 (devono essere diversi tra loro e liberi: non USB 19/20, LED 48, BOOT 0, console 43/44, JTAG 39-42, I2C 8/9)
#   kHz    = frequenza SPI da 400 a 20000 (di fabbrica 1000; per le prime prove 400-1000)
# Solo FAT/FAT32. exFAT viene rifiutato con il messaggio "serve FAT32". VesevOS non formatta mai da solo.
# Le righe che iniziano con # sono commenti per chi legge: il firmware le ignora e le perde al primo salvataggio dalla pagina.
# Il modo normale NON e copiare questo file: si aggiunge dalla pagina Periferiche > "Aggiungi una periferica a mano" > "Lettore microSD (4 pin)".
# Collegamento fisico: vedi docs/progetto/sd-collegamento.md. Mai provata su una scheda vera.
sd1 7 10 0 11 12 13 1000
