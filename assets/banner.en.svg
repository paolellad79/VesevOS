<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="VesevOS - one platform, a thousand boards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#10223a"/>
      <stop offset="1" stop-color="#0e4a5c"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fa7ff"/>
      <stop offset="1" stop-color="#37e0b0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fa7ff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#3fa7ff"/>
      <stop offset="0.8" stop-color="#37e0b0"/>
      <stop offset="1" stop-color="#37e0b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3552"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="lava" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.45" stop-color="#ff6a3d" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <!-- reticolo leggero -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
  </g>
  <!-- Vesuvio e golfo -->
  <g transform="translate(838 204) scale(0.43) translate(0 -338)">
    <ellipse cx="600" cy="338" rx="70" ry="34" fill="url(#lava)"/>
    <g fill="none" stroke="url(#ac)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 456C70 452 130 444 200 432C270 420 340 398 420 370C440 362 452 350 468 347C484 345 492 356 510 362C525 366 536 358 552 349C568 339 584 337 600 338C620 339 635 346 650 354C675 367 705 380 740 388C775 395 805 402 838 410" stroke-width="9"/>
      <path d="M208 464C280 458 380 456 470 455C520 455 560 454 592 454M208 464C300 470 380 474 440 477C520 481 610 485 692 488" stroke-width="7" stroke-opacity="0.85"/>
      <path d="M478 451C520 446 570 445 620 445C690 444 760 444 805 449" stroke-width="7" stroke-opacity="0.6"/>
    </g>
  </g>
  <!-- chip -->
  <g transform="translate(70 70)">
    <g stroke="url(#ac)" stroke-width="6" stroke-linecap="round">
      <path d="M40 -6V22M80 -6V22M120 -6V22M40 178V206M80 178V206M120 178V206"/>
      <path d="M-6 40H22M-6 80H22M-6 120H22M178 40H206M178 80H206M178 120H206" transform="translate(0 0)"/>
    </g>
    <rect x="20" y="20" width="160" height="160" rx="22" fill="#0b1220" stroke="url(#ac)" stroke-width="6"/>
    <circle cx="100" cy="100" r="44" fill="none" stroke="url(#ac)" stroke-width="6"/>
    <circle cx="100" cy="100" r="14" fill="url(#ac)"/>
    <path d="M100 56V30M100 170V144M56 100H30M170 100H144" stroke="url(#ac)" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- testo -->
  <text x="330" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="1">Vesev<tspan fill="url(#ac)">OS</tspan></text>
  <text x="334" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="29" font-weight="500" fill="#bcd0e6">One platform, a thousand boards, each with its own identity.</text>
  <!-- battito -->
  <path d="M334 244H520L548 210L580 270L612 228L636 244H900" fill="none" stroke="url(#pulse)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="334" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#7f95ad" letter-spacing="2">ESP32-S3  •  SIMPLE  •  SECURE  •  WORKS WITHOUT INTERNET</text>
</svg>
